    color:#F9F7EC;font:600 1rem inherit;font-family:inherit;cursor:pointer}

  button:disabled{opacity:.7;cursor:default}

  var ITER=600000, STORE="lhbc_gate_key2";
  var store=(function(){ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return localStorage; }catch(e){ return sessionStorage; } })();
  var form=document.getElementById("gate"), input=document.getElementById("pw"),
      btn=form.querySelector("button"), err=form.querySelector(".err");
  var subtle=window.crypto&&window.crypto.subtle;
  if(!subtle){ err.textContent="This page needs HTTPS to unlock."; input.disabled=btn.disabled=true; return; }
  function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function toB64(buf){ var a=new Uint8Array(buf), s=""; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
  var raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  function keyFromPassword(pw){
    return subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
      return subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:ITER},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    });
  }
  function keyFromStore(b){ return subtle.importKey("raw",b64(b),{name:"AES-GCM"},true,["decrypt"]); }
  // document.open() is a no-op while the parser is still running; wait for it to finish or the
  // site gets written INTO the gate page instead of replacing it.
  function parsed(){
    return new Promise(function(res){
      if(document.readyState!=="loading") res();
      else document.addEventListener("DOMContentLoaded",function(){ res(); });
    });
  }
  function render(key){
    return subtle.decrypt({name:"AES-GCM",iv:iv},key,ct).then(function(plain){
      var html=new TextDecoder().decode(plain);
      return subtle.exportKey("raw",key).then(function(k){
        try{ store.setItem(STORE,toB64(k)); }catch(e){}
        return parsed().then(function(){ document.open(); document.write(html); document.close(); });
      });
    });
  }
  var saved=null; try{ saved=store.getItem(STORE); }catch(e){}
  if(saved){
    form.hidden=true;
    keyFromStore(saved).then(render).catch(function(){
      try{ store.removeItem(STORE); }catch(e){}
      form.hidden=false; input.focus();
    });
  }
  form.addEventListener("submit",function(e){
    e.preventDefault();
    err.textContent=""; btn.disabled=true;
    keyFromPassword(input.value).then(render).catch(function(){
      err.textContent="Incorrect password."; input.value=""; btn.disabled=false; input.focus();
    });
  });
})();
