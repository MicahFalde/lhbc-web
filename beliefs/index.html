  }
  function keyFromStore(b){ return subtle.importKey("raw",b64(b),{name:"AES-GCM"},true,["decrypt"]); }
  // document.open() is a no-op while the parser is still running; wait for it to finish or the
  // site gets written INTO the gate page instead of replacing it.
  function parsed(){
    return new Promise(function(res){
      if(document.readyState!=="loading") res();
      else document.addEventListener("DOMContentLoaded",function(){ res(); });
    });
  }
  function render(key){
    return subtle.decrypt({name:"AES-GCM",iv:iv},key,ct).then(function(plain){
      var html=new TextDecoder().decode(plain);
      return subtle.exportKey("raw",key).then(function(k){
        try{ store.setItem(STORE,toB64(k)); }catch(e){}
        return parsed().then(function(){ document.open(); document.write(html); document.close(); });
      });
    });
  }
  var saved=null; try{ saved=store.getItem(STORE); }catch(e){}
  if(saved){
    form.hidden=true;
    keyFromStore(saved).then(render).catch(function(){
      try{ store.removeItem(STORE); }catch(e){}
      form.hidden=false; input.focus();
    });
  }
  form.addEventListener("submit",function(e){
    e.preventDefault();
    err.textContent=""; btn.disabled=true;
    keyFromPassword(input.value).then(render).catch(function(){
      err.textContent="Incorrect password."; input.value=""; btn.disabled=false; input.focus();
    });
  });
})();
</script>
</body>
</html>
